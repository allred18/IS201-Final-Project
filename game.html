            <div id="game">
            <h1>Color Tiles</h1>
            <p class="subtitle">Swap tiles to group all matching colors into rectangles</p>

            <div class="difficulty">
                <button class="diff-btn active" onclick="setDifficulty('easy', this)">Easy (4×4)</button>
                <button class="diff-btn" onclick="setDifficulty('medium', this)">Medium (5×5)</button>
                <button class="diff-btn" onclick="setDifficulty('hard', this)">Hard (6×6)</button>
            </div>

            <div class="meta">
                <span>Moves: <strong id="moveCount">0</strong></span>
                <span>Best: <strong id="bestCount">—</strong></span>
                <span>Done: <strong id="groupsDone">0</strong> / <strong id="groupsTotal">0</strong></span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width:0%"></div>
            </div>

            <div id="board"></div>
            <div id="msg"></div>
            <div class="legend" id="legend"></div>

            <div class="controls">
                <button onclick="undoMove()">↩ Undo</button>
                <button id="newGameBtn" onclick="newGame()">New Game</button>
                <button onclick="solveHint()">💡 Hint</button>
            </div>

            <p class="instructions">
                Click a tile to select it, then click another to swap them.<br>
                Group all tiles of the same color into a solid rectangle to lock them in.
            </p>
            </div>

            <script>
            const COLORS = [
                { name: 'Red',    bg: '#E24B4A' },
                { name: 'Blue',   bg: '#378ADD' },
                { name: 'Green',  bg: '#639922' },
                { name: 'Amber',  bg: '#EF9F27' },
                { name: 'Purple', bg: '#7F77DD' },
                { name: 'Teal',   bg: '#1D9E75' },
                { name: 'Coral',  bg: '#D85A30' },
                { name: 'Pink',   bg: '#D4537E' },
            ];

            let gridSize = 5;
            let numColors = 5;
            let tiles = [];
            let selected = null;
            let moves = 0;
            let bestMoves = {};
            let history = [];
            let lockedGroups = new Set();
            let currentDifficulty = 'medium';

            function setDifficulty(d, btn) {
                currentDifficulty = d;
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (d === 'easy')   { gridSize = 4; numColors = 4; }
                if (d === 'medium') { gridSize = 5; numColors = 5; }
                if (d === 'hard')   { gridSize = 6; numColors = 6; }
                newGame();
            }

            function newGame() {
                moves = 0;
                selected = null;
                history = [];
                lockedGroups = new Set();
                document.getElementById('moveCount').textContent = '0';
                document.getElementById('msg').textContent = '';
                const key = currentDifficulty;
                document.getElementById('bestCount').textContent = bestMoves[key] !== undefined ? bestMoves[key] : '—';
                generateTiles();
                renderBoard();
                renderLegend();
                updateProgress();
            }

            function generateTiles() {
                const total = gridSize * gridSize;
                const perColor = Math.floor(total / numColors);
                let arr = [];
                for (let i = 0; i < numColors; i++)
                for (let j = 0; j < perColor; j++) arr.push(i);
                while (arr.length < total) arr.push(Math.floor(Math.random() * numColors));
                for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                tiles = arr;
            }

            function renderBoard() {
                const board = document.getElementById('board');
                board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
                board.innerHTML = '';
                tiles.forEach((colorIdx, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile'
                    + (lockedGroups.has(colorIdx) ? ' locked' : '')
                    + (selected === i ? ' selected' : '');
                tile.style.background = COLORS[colorIdx].bg;
                if (!lockedGroups.has(colorIdx)) tile.onclick = () => handleClick(i);
                board.appendChild(tile);
                });
            }

            function handleClick(idx) {
                if (lockedGroups.has(tiles[idx])) return;
                if (selected === null) {
                selected = idx;
                } else if (selected === idx) {
                selected = null;
                } else {
                history.push([...tiles]);
                [tiles[selected], tiles[idx]] = [tiles[idx], tiles[selected]];
                moves++;
                document.getElementById('moveCount').textContent = moves;
                selected = null;
                checkLocks();
                updateProgress();
                checkWin();
                }
                renderBoard();
            }

            function checkLocks() {
                for (let c = 0; c < numColors; c++) {
                if (lockedGroups.has(c)) continue;
                const indices = tiles.map((t, i) => t === c ? i : -1).filter(i => i >= 0);
                if (isGrouped(indices)) lockedGroups.add(c);
                }
            }

            function isGrouped(indices) {
                if (!indices.length) return false;
                const rows = indices.map(i => Math.floor(i / gridSize));
                const cols = indices.map(i => i % gridSize);
                const minR = Math.min(...rows), maxR = Math.max(...rows);
                const minC = Math.min(...cols), maxC = Math.max(...cols);
                const area = (maxR - minR + 1) * (maxC - minC + 1);
                if (area !== indices.length) return false;
                const set = new Set(indices);
                for (let r = minR; r <= maxR; r++)
                for (let c = minC; c <= maxC; c++)
                    if (!set.has(r * gridSize + c)) return false;
                return true;
            }

            function updateProgress() {
                document.getElementById('groupsDone').textContent = lockedGroups.size;
                document.getElementById('groupsTotal').textContent = numColors;
                document.getElementById('progressFill').style.width = Math.round((lockedGroups.size / numColors) * 100) + '%';
            }

            function checkWin() {
                if (lockedGroups.size === numColors) {
                document.getElementById('msg').textContent = '🎉 Solved in ' + moves + ' moves!';
                const key = currentDifficulty;
                if (bestMoves[key] === undefined || moves < bestMoves[key]) {
                    bestMoves[key] = moves;
                    document.getElementById('bestCount').textContent = moves;
                }
                }
            }

            function undoMove() {
                if (!history.length) return;
                tiles = history.pop();
                moves = Math.max(0, moves - 1);
                lockedGroups = new Set();
                checkLocks();
                document.getElementById('moveCount').textContent = moves;
                document.getElementById('msg').textContent = '';
                renderBoard();
                updateProgress();
            }

            function solveHint() {
                let bestScore = -Infinity, bestSwap = null;
                for (let a = 0; a < tiles.length; a++) {
                for (let b = a + 1; b < tiles.length; b++) {
                    if (tiles[a] === tiles[b]) continue;
                    if (lockedGroups.has(tiles[a]) || lockedGroups.has(tiles[b])) continue;
                    [tiles[a], tiles[b]] = [tiles[b], tiles[a]];
                    const score = scoreBoard();
                    [tiles[a], tiles[b]] = [tiles[b], tiles[a]];
                    if (score > bestScore) { bestScore = score; bestSwap = [a, b]; }
                }
                }
                if (bestSwap) {
                selected = bestSwap[0];
                renderBoard();
                document.getElementById('msg').textContent = '💡 Hint: swap the highlighted tile!';
                setTimeout(() => {
                    if (selected === bestSwap[0]) { selected = null; renderBoard(); document.getElementById('msg').textContent = ''; }
                }, 2500);
                }
            }

            function scoreBoard() {
                let score = 0;
                for (let c = 0; c < numColors; c++) {
                if (lockedGroups.has(c)) { score += 100; continue; }
                const indices = tiles.map((t, i) => t === c ? i : -1).filter(i => i >= 0);
                const rows = indices.map(i => Math.floor(i / gridSize));
                const cols = indices.map(i => i % gridSize);
                score -= (Math.max(...rows) - Math.min(...rows)) + (Math.max(...cols) - Math.min(...cols));
                }
                return score;
            }

            function renderLegend() {
                const legend = document.getElementById('legend');
                legend.innerHTML = '';
                for (let i = 0; i < numColors; i++) {
                legend.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${COLORS[i].bg}"></div><span>${COLORS[i].name}</span></div>`;
                }
            }

            newGame();
            </script>
